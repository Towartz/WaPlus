# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  AuroraChat — GitHub Actions Build Pipeline                                 ║
# ║                                                                              ║
# ║  Triggers:                                                                   ║
# ║    • Push tag  v*.*.*        → full release (win + linux + mac)             ║
# ║    • Manual dispatch         → pilih platform + mode (normal / secure)      ║
# ║    • Push ke branch dev-*    → linux only otomatis (quick error check)       ║
# ║                                                                              ║
# ║  Strategy: setiap platform jalan di runner native masing-masing             ║
# ║    • Windows  → windows-latest                                               ║
# ║    • Linux    → ubuntu-22.04                                                 ║
# ║    • macOS    → macos-13  (Intel, support Electron cross-compile arm64)      ║
# ║                                                                              ║
# ║  inject-win-sqlite.js dipakai di semua platform untuk inject prebuilt        ║
# ║  better-sqlite3 binary yang sesuai, lalu npmRebuild=false                   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: Build AuroraChat

on:
  # ── Tag push → full release ──────────────────────────────────────────────────
  push:
    tags:
      - "v*.*.*"
    branches:
      - "dev-*"          # dev branch → linux quick-build only

  # ── Manual trigger: pilih platform + branch + mode ───────────────────────────
  workflow_dispatch:
    inputs:
      platforms:
        description: "🖥️ Platform(s) to build"
        required: true
        type: choice
        default: "linux"
        options:
          - linux
          - windows
          - macos
          - all
          - windows-linux
          - windows-macos
          - linux-macos
      branch:
        description: "🌿 Branch to build from (kosongkan = branch saat ini)"
        required: false
        type: string
        default: ""
      secure:
        description: "🔒 Obfuscate before build (--secure)"
        required: false
        type: boolean
        default: false
      release:
        description: "🚀 Upload as GitHub Release"
        required: false
        type: boolean
        default: false

# ── Cancel in-progress runs on same branch/tag ──────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared env ───────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  # electron-builder butuh ini di Linux untuk AppImage
  ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"

# ════════════════════════════════════════════════════════════════════════════════
# JOB: decide — resolve which platforms actually run
# ════════════════════════════════════════════════════════════════════════════════
jobs:
  decide:
    name: "🎯 Decide platforms"
    runs-on: ubuntu-latest
    outputs:
      run_windows : ${{ steps.resolve.outputs.run_windows }}
      run_linux   : ${{ steps.resolve.outputs.run_linux }}
      run_macos   : ${{ steps.resolve.outputs.run_macos }}
      secure_flag : ${{ steps.resolve.outputs.secure_flag }}
      is_release  : ${{ steps.resolve.outputs.is_release }}
      version     : ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Resolve matrix
        id: resolve
        run: |
          # ── Defaults ──────────────────────────────────────────────────────────
          RUN_WIN=false
          RUN_LINUX=false
          RUN_MAC=false
          SECURE=false
          IS_RELEASE=false

          # ── Tag push → semua platform + release ──────────────────────────────
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RUN_WIN=true; RUN_LINUX=true; RUN_MAC=true
            IS_RELEASE=true
            echo "Triggered by tag → all platforms + release"

          # ── dev-* branch push → linux only ───────────────────────────────────
          elif [[ "${{ github.ref }}" == refs/heads/dev-* ]]; then
            RUN_LINUX=true
            echo "dev branch push → linux only"

          # ── Manual dispatch ───────────────────────────────────────────────────
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PLAT="${{ github.event.inputs.platforms }}"
            case "$PLAT" in
              all)            RUN_WIN=true; RUN_LINUX=true; RUN_MAC=true ;;
              windows)        RUN_WIN=true ;;
              linux)          RUN_LINUX=true ;;
              macos)          RUN_MAC=true ;;
              windows-linux)  RUN_WIN=true; RUN_LINUX=true ;;
              windows-macos)  RUN_WIN=true; RUN_MAC=true ;;
              linux-macos)    RUN_LINUX=true; RUN_MAC=true ;;
            esac
            SECURE="${{ github.event.inputs.secure }}"
            IS_RELEASE="${{ github.event.inputs.release }}"
          fi

          # ── Resolve version ───────────────────────────────────────────────────
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            BRANCH_INPUT="${{ github.event.inputs.branch }}"
            BRANCH_NAME="${BRANCH_INPUT:-${{ github.ref_name }}}"
            SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
            VERSION="${BRANCH_NAME}-${SHORT_SHA}"
          fi

          # ── Secure flag ───────────────────────────────────────────────────────
          [[ "$SECURE" == "true" ]] && SECURE_FLAG="--secure" || SECURE_FLAG=""

          echo "run_windows=$RUN_WIN"   >> $GITHUB_OUTPUT
          echo "run_linux=$RUN_LINUX"   >> $GITHUB_OUTPUT
          echo "run_macos=$RUN_MAC"     >> $GITHUB_OUTPUT
          echo "secure_flag=$SECURE_FLAG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION"       >> $GITHUB_OUTPUT

          echo ""
          echo "Summary:"
          echo "  Windows : $RUN_WIN"
          echo "  Linux   : $RUN_LINUX"
          echo "  macOS   : $RUN_MAC"
          echo "  Secure  : $SECURE_FLAG"
          echo "  Release : $IS_RELEASE"
          echo "  Version : $VERSION"

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB: build-windows
  # ══════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: "🪟 Build Windows"
    needs: decide
    if: needs.decide.outputs.run_windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # postinstall (electron-builder install-app-deps) di-skip dulu,
      # inject script yang handle native binary
      - name: Install dependencies
        run: npm ci --ignore-scripts
        shell: bash

      - name: Inject better-sqlite3 Windows binary
        run: node scripts/inject-win-sqlite.js --platform win32 --arch x64
        shell: bash

      - name: Vite build
        run: npm run build
        shell: bash

      - name: Obfuscate (if secure)
        if: needs.decide.outputs.secure_flag == '--secure'
        run: node scripts/obfuscate.js
        shell: bash

      - name: electron-builder Windows
        run: npx --no -- electron-builder --win --config.npmRebuild=false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Verify binary in release output ──────────────────────────────────────
      - name: Verify better_sqlite3.node (Windows)
        shell: pwsh
        run: |
          $nodePath = Get-ChildItem -Recurse -Path "release" -Filter "better_sqlite3.node" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nodePath) { Write-Error "better_sqlite3.node not found in release/"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes($nodePath.FullName)
          $magic = "{0:X2}{1:X2}" -f $bytes[0], $bytes[1]
          Write-Host "Path : $($nodePath.FullName)"
          Write-Host "Magic: $magic"
          if ($magic -ne "4D5A") {
            Write-Error "WRONG BINARY! Expected PE32 (4D5A), got $magic"
            exit 1
          }
          Write-Host "✅ PE32+ confirmed (Windows binary OK)"

      - name: List release artifacts
        shell: bash
        run: |
          echo "=== Windows Release Artifacts ==="
          find release -maxdepth 2 \( -name "*.exe" -o -name "*.msi" \) 2>/dev/null | sort
          echo ""
          du -sh release/ 2>/dev/null || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraChat-Windows-${{ needs.decide.outputs.version }}
          path: |
            release/*.exe
            release/*.msi
          retention-days: 14
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB: build-linux
  # ══════════════════════════════════════════════════════════════════════════════
  build-linux:
    name: "🐧 Build Linux"
    needs: decide
    if: needs.decide.outputs.run_linux == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # electron-builder untuk AppImage butuh fuse di linux
      - name: Install system deps (AppImage, RPM, deb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            libopenjp2-tools \
            rpm \
            fakeroot \
            dpkg \
            libfuse2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Inject better-sqlite3 Linux binary
        run: node scripts/inject-win-sqlite.js --platform linux --arch x64

      - name: Vite build
        run: npm run build

      - name: Obfuscate (if secure)
        if: needs.decide.outputs.secure_flag == '--secure'
        run: node scripts/obfuscate.js

      - name: electron-builder Linux
        run: npx --no -- electron-builder --linux --config.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Verify ───────────────────────────────────────────────────────────────
      - name: Verify better_sqlite3.node (Linux)
        run: |
          NODE_BIN=$(find release -name "better_sqlite3.node" 2>/dev/null | head -1)
          if [ -z "$NODE_BIN" ]; then
            echo "❌ better_sqlite3.node not found in release/"
            exit 1
          fi
          MAGIC=$(xxd -p -l 4 "$NODE_BIN")
          echo "Path : $NODE_BIN"
          echo "Magic: $MAGIC"
          if [[ "$MAGIC" != "7f454c46" ]]; then
            echo "❌ WRONG BINARY! Expected ELF (7f454c46), got $MAGIC"
            exit 1
          fi
          FILE_INFO=$(file "$NODE_BIN" 2>/dev/null || echo "file cmd unavailable")
          echo "File : $FILE_INFO"
          echo "✅ ELF confirmed (Linux binary OK)"

      - name: List release artifacts
        run: |
          echo "=== Linux Release Artifacts ==="
          find release -maxdepth 2 \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pacman" \) 2>/dev/null | sort
          echo ""
          du -sh release/ 2>/dev/null || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraChat-Linux-${{ needs.decide.outputs.version }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
          retention-days: 14
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB: build-macos
  # ══════════════════════════════════════════════════════════════════════════════
  build-macos:
    name: "🍎 Build macOS"
    needs: decide
    if: needs.decide.outputs.run_macos == 'true'
    # macos-13 = Intel Haswell, bisa cross-compile arm64 Electron
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Inject better-sqlite3 macOS binary
        run: node scripts/inject-win-sqlite.js --platform darwin --arch x64

      - name: Vite build
        run: npm run build

      - name: Obfuscate (if secure)
        if: needs.decide.outputs.secure_flag == '--secure'
        run: node scripts/obfuscate.js

      - name: electron-builder macOS
        run: npx --no -- electron-builder --mac --config.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing di-skip (no Apple cert di CI)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # ── Verify ───────────────────────────────────────────────────────────────
      - name: Verify better_sqlite3.node (macOS)
        run: |
          NODE_BIN=$(find release -name "better_sqlite3.node" 2>/dev/null | head -1)
          if [ -z "$NODE_BIN" ]; then
            echo "❌ better_sqlite3.node not found in release/"
            exit 1
          fi
          MAGIC=$(xxd -p -l 4 "$NODE_BIN")
          echo "Path : $NODE_BIN"
          echo "Magic: $MAGIC"
          # Mach-O 64-bit: cffaedfe  |  Mach-O FAT: cafebabe
          if [[ "$MAGIC" != "cffaedfe" && "$MAGIC" != "cafebabe" ]]; then
            echo "❌ WRONG BINARY! Expected Mach-O (cffaedfe / cafebabe), got $MAGIC"
            exit 1
          fi
          FILE_INFO=$(file "$NODE_BIN" 2>/dev/null || echo "file cmd unavailable")
          echo "File : $FILE_INFO"
          echo "✅ Mach-O confirmed (macOS binary OK)"

      - name: List release artifacts
        run: |
          echo "=== macOS Release Artifacts ==="
          find release -maxdepth 3 \( -name "*.dmg" -o -name "*.zip" \) 2>/dev/null | sort
          echo ""
          du -sh release/ 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraChat-macOS-${{ needs.decide.outputs.version }}
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 14
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB: release — buat GitHub Release dan attach semua artifacts
  # Hanya jalan kalau is_release=true dan semua build job selesai (success/skip)
  # ══════════════════════════════════════════════════════════════════════════════
  release:
    name: "🚀 GitHub Release"
    needs: [decide, build-windows, build-linux, build-macos]
    # Jalan kalau: is_release true DAN semua build job tidak failed
    # (success = ran + ok, skipped = tidak di-trigger, keduanya OK)
    if: |
      always() &&
      needs.decide.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    permissions:
      contents: write   # buat bikin release + upload assets

    steps:
      - name: Checkout (untuk release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # butuh full history buat changelog

      # ── Download semua artifacts dari jobs sebelumnya ─────────────────────────
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts/
          # pattern kosong = download semua artifacts dari run ini

      - name: List downloaded artifacts
        run: |
          echo "=== All downloaded artifacts ==="
          find dist-artifacts/ -type f | sort
          echo ""
          du -sh dist-artifacts/

      # ── Auto-generate changelog dari git log sejak tag sebelumnya ─────────────
      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.decide.outputs.version }}"

          # Cari tag sebelumnya
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p' || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Changelog from $PREV_TAG → $VERSION"
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges | head -50)
          else
            echo "No previous tag, using last 20 commits"
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          # Write changelog ke file (multiline safe)
          {
            echo "## AuroraChat $VERSION"
            echo ""
            echo "### Changes"
            echo "$CHANGES"
            echo ""
            echo "### Downloads"
            echo "| Platform | Format | |"
            echo "|----------|--------|---|"
            echo "| 🪟 Windows | NSIS Installer (.exe) | Recommended |"
            echo "| 🪟 Windows | Portable (.exe) | No install needed |"
            echo "| 🐧 Linux | AppImage | Universal |"
            echo "| 🐧 Linux | .deb | Debian/Ubuntu |"
            echo "| 🐧 Linux | .pacman | Arch/CachyOS |"
            echo "| 🍎 macOS | .dmg | Intel + Apple Silicon |"
            echo ""
            echo "> Built with Electron \`$(node -e "const p=require('./package.json'); console.log(p.devDependencies.electron.replace('^',''))")\` · better-sqlite3 auto-injected per platform"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name     : ${{ needs.decide.outputs.version }}
          name         : "AuroraChat ${{ needs.decide.outputs.version }}"
          body_path    : RELEASE_NOTES.md
          draft        : false
          prerelease   : ${{ contains(needs.decide.outputs.version, '-') }}
          files        : dist-artifacts/**/*
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB: summary — print final build status ringkas di Actions UI
  # ══════════════════════════════════════════════════════════════════════════════
  summary:
    name: "📋 Build Summary"
    needs: [decide, build-windows, build-linux, build-macos]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write Job Summary
        run: |
          VERSION="${{ needs.decide.outputs.version }}"

          WIN_STATUS="${{ needs.build-windows.result }}"
          LIN_STATUS="${{ needs.build-linux.result }}"
          MAC_STATUS="${{ needs.build-macos.result }}"

          status_icon() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              skipped)  echo "⏭️" ;;
              cancelled)echo "🚫" ;;
              *)        echo "❓" ;;
            esac
          }

          {
            echo "## AuroraChat Build — $VERSION"
            echo ""
            echo "| Platform | Status | Result |"
            echo "|----------|--------|--------|"
            echo "| 🪟 Windows | $(status_icon $WIN_STATUS) | $WIN_STATUS |"
            echo "| 🐧 Linux   | $(status_icon $LIN_STATUS) | $LIN_STATUS |"
            echo "| 🍎 macOS   | $(status_icon $MAC_STATUS) | $MAC_STATUS |"
            echo ""
            echo "**Triggered by:** \`${{ github.event_name }}\` · **Ref:** \`${{ github.ref }}\`"
            echo ""
            echo "**Secure/obfuscate:** \`${{ needs.decide.outputs.secure_flag || 'no' }}\`"
            echo "**Release upload:** \`${{ needs.decide.outputs.is_release }}\`"
          } >> $GITHUB_STEP_SUMMARY
