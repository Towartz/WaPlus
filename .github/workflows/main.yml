# ──────────────────────────────────────────────────────────────────────────────
# AuroraChat — GitHub Actions Build Pipeline
# ──────────────────────────────────────────────────────────────────────────────

name: Build AuroraChat

on:
  push:
    tags:
      - "v*.*.*"

    branches:
      - "dev-*"

  workflow_dispatch:
    inputs:

      platforms:
        description: "Platform(s) to build"
        required: true
        type: choice
        default: "🐧 Linux"
        options:
          - "🐧 Linux"
          - "🪟 Windows"
          - "🍎 macOS"
          - "🪟 Windows + 🐧 Linux"
          - "🪟 Windows + 🍎 macOS"
          - "🐧 Linux + 🍎 macOS"
          - "🪟 Windows + 🐧 Linux + 🍎 macOS"

      branch:
        description: "Branch to build from (leave empty = current branch)"
        required: false
        type: string
        default: ""

      version:
        description: "App version to set in package.json  e.g. 1.2.0  (leave empty = keep current)"
        required: false
        type: string
        default: ""

      release_type:
        description: "Release type"
        required: true
        type: choice
        default: "none — artifacts only"
        options:
          - "none — artifacts only"
          - "pre-release"
          - "release"

      secure:
        description: "Obfuscate source before packaging"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  decide:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      run_windows  : ${{ steps.resolve.outputs.run_windows }}
      run_linux    : ${{ steps.resolve.outputs.run_linux }}
      run_macos    : ${{ steps.resolve.outputs.run_macos }}
      secure       : ${{ steps.resolve.outputs.secure }}
      publish      : ${{ steps.resolve.outputs.publish }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      version      : ${{ steps.resolve.outputs.version }}
      app_version  : ${{ steps.resolve.outputs.app_version }}
      build_ref    : ${{ steps.resolve.outputs.build_ref }}
      tag_name     : ${{ steps.resolve.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Resolve matrix
        id: resolve
        run: |
          RUN_WIN=false
          RUN_LINUX=false
          RUN_MAC=false
          SECURE=false
          PUBLISH=false
          IS_PRERELEASE=false

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RUN_WIN=true; RUN_LINUX=true; RUN_MAC=true
            PUBLISH=true
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" =~ -(beta|alpha|rc|pre) ]]; then
              IS_PRERELEASE=true
            fi

          elif [[ "${{ github.ref }}" == refs/heads/dev-* ]]; then
            RUN_LINUX=true

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PLAT="${{ github.event.inputs.platforms }}"
            [[ "$PLAT" == *"Windows"* ]] && RUN_WIN=true
            [[ "$PLAT" == *"Linux"*   ]] && RUN_LINUX=true
            [[ "$PLAT" == *"macOS"*   ]] && RUN_MAC=true
            SECURE="${{ github.event.inputs.secure }}"
            REL_TYPE="${{ github.event.inputs.release_type }}"
            [[ "$REL_TYPE" == *"release"*     ]] && PUBLISH=true
            [[ "$REL_TYPE" == *"pre-release"* ]] && IS_PRERELEASE=true
          fi

          BRANCH_INPUT="${{ github.event.inputs.branch }}"
          BUILD_REF="${BRANCH_INPUT:-${{ github.ref }}}"

          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [[ -n "$VERSION_INPUT" ]]; then
            APP_VERSION="${VERSION_INPUT#v}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            APP_VERSION="${{ github.ref_name }}"
            APP_VERSION="${APP_VERSION#v}"
          else
            APP_VERSION=$(node -p "require('./package.json').version")
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            CI_VERSION="${{ github.ref_name }}"
          else
            BRANCH_NAME="${BRANCH_INPUT:-${{ github.ref_name }}}"
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            CI_VERSION="${BRANCH_NAME}-${SHORT_SHA}"
          fi

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${APP_VERSION}"
          fi

          echo "run_windows=$RUN_WIN"         >> $GITHUB_OUTPUT
          echo "run_linux=$RUN_LINUX"         >> $GITHUB_OUTPUT
          echo "run_macos=$RUN_MAC"           >> $GITHUB_OUTPUT
          echo "secure=$SECURE"               >> $GITHUB_OUTPUT
          echo "publish=$PUBLISH"             >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "version=$CI_VERSION"          >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION"     >> $GITHUB_OUTPUT
          echo "build_ref=$BUILD_REF"         >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME"           >> $GITHUB_OUTPUT

  build-windows:
    name: "🪟 Windows"
    needs: decide
    if: needs.decide.outputs.run_windows == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.build_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --ignore-scripts
        shell: bash

      - name: Bump version in package.json
        shell: bash
        run: |
          APP_VER="${{ needs.decide.outputs.app_version }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$APP_VER" != "$CURRENT" ]]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json','utf8'));
              p.version = '$APP_VER';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            echo "Version bumped: $CURRENT → $APP_VER"
          else
            echo "Version unchanged: $CURRENT"
          fi

      - name: Inject better-sqlite3 — Windows x64
        run: node scripts/inject-win-sqlite.js --platform win32 --arch x64
        shell: bash

      - name: Vite build
        run: npm run build
        shell: bash

      - name: Obfuscate
        if: needs.decide.outputs.secure == 'true'
        run: node scripts/obfuscate.js
        shell: bash

      - name: Package — electron-builder
        run: npx --no -- electron-builder --win --config.npmRebuild=false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify better_sqlite3.node
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Recurse -Path "release" -Filter "better_sqlite3.node" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bin) { Write-Error "better_sqlite3.node not found in release/"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes($bin.FullName)
          $magic = "{0:X2}{1:X2}" -f $bytes[0], $bytes[1]
          if ($magic -ne "4D5A") {
            Write-Error "Wrong binary type! Expected PE32 (4D5A), got $magic"; exit 1
          }
          Write-Host "✅ PE32+ confirmed — $($bin.FullName)"

      - name: Rename artifacts
        shell: bash
        run: |
          VER="${{ needs.decide.outputs.app_version }}"
          cd release
          for f in *.exe *.msi; do
            [ -f "$f" ] || continue
            NEW=$(echo "$f" | sed -E "s/ [0-9]+\.[0-9]+\.[0-9]+//g")
            EXT="${NEW##*.}"
            BASE="${NEW%.*}"
            FINAL="${BASE}-v${VER}.${EXT}"
            mv "$f" "$FINAL" 2>/dev/null || true
            echo "  $f → $FINAL"
          done

      - name: List artifacts
        shell: bash
        run: |
          echo "Windows artifacts:"
          find release -maxdepth 1 \( -name "*.exe" -o -name "*.msi" \) | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraChat-Windows-${{ needs.decide.outputs.app_version }}
          path: |
            release/*.exe
            release/*.msi
          retention-days: 30
          if-no-files-found: warn

  build-linux:
    name: "🐧 Linux"
    needs: decide
    if: needs.decide.outputs.run_linux == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.build_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools rpm fakeroot dpkg libfuse2

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Bump version in package.json
        run: |
          APP_VER="${{ needs.decide.outputs.app_version }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$APP_VER" != "$CURRENT" ]]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json','utf8'));
              p.version = '$APP_VER';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            echo "Version bumped: $CURRENT → $APP_VER"
          else
            echo "Version unchanged: $CURRENT"
          fi

      - name: Inject better-sqlite3 — Linux x64
        run: node scripts/inject-win-sqlite.js --platform linux --arch x64

      - name: Vite build
        run: npm run build

      - name: Obfuscate
        if: needs.decide.outputs.secure == 'true'
        run: node scripts/obfuscate.js

      - name: Package — electron-builder
        run: npx --no -- electron-builder --linux --config.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify better_sqlite3.node
        run: |
          BIN=$(find release -name "better_sqlite3.node" 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then echo "❌ better_sqlite3.node not found"; exit 1; fi
          MAGIC=$(xxd -p -l 4 "$BIN")
          if [[ "$MAGIC" != "7f454c46" ]]; then
            echo "❌ Wrong binary type! Expected ELF (7f454c46), got $MAGIC"; exit 1
          fi
          echo "✅ ELF confirmed — $BIN"
          file "$BIN" 2>/dev/null || true

      - name: Rename artifacts
        run: |
          VER="${{ needs.decide.outputs.app_version }}"
          cd release
          for f in *.AppImage *.deb *.rpm *.pacman; do
            [ -f "$f" ] || continue
            NEW=$(echo "$f" | sed -E "s/[_-][0-9]+\.[0-9]+\.[0-9]+//g")
            EXT="${NEW##*.}"
            BASE="${NEW%.*}"
            FINAL="${BASE}-v${VER}.${EXT}"
            mv "$f" "$FINAL" 2>/dev/null || true
            echo "  $f → $FINAL"
          done

      - name: List artifacts
        run: |
          echo "Linux artifacts:"
          find release -maxdepth 1 \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pacman" \) | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraChat-Linux-${{ needs.decide.outputs.app_version }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
          retention-days: 30
          if-no-files-found: warn

  build-macos:
    name: "🍎 macOS"
    needs: decide
    if: needs.decide.outputs.run_macos == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.build_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Bump version in package.json
        run: |
          APP_VER="${{ needs.decide.outputs.app_version }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$APP_VER" != "$CURRENT" ]]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json','utf8'));
              p.version = '$APP_VER';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            echo "Version bumped: $CURRENT → $APP_VER"
          else
            echo "Version unchanged: $CURRENT"
          fi

      - name: Inject better-sqlite3 — macOS x64
        run: node scripts/inject-win-sqlite.js --platform darwin --arch x64

      - name: Vite build
        run: npm run build

      - name: Obfuscate
        if: needs.decide.outputs.secure == 'true'
        run: node scripts/obfuscate.js

      - name: Package — electron-builder
        run: npx --no -- electron-builder --mac --config.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify better_sqlite3.node
        run: |
          BIN=$(find release -name "better_sqlite3.node" 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then echo "❌ better_sqlite3.node not found"; exit 1; fi
          MAGIC=$(xxd -p -l 4 "$BIN")
          if [[ "$MAGIC" != "cffaedfe" && "$MAGIC" != "cafebabe" ]]; then
            echo "❌ Wrong binary type! Expected Mach-O, got $MAGIC"; exit 1
          fi
          echo "✅ Mach-O confirmed — $BIN"
          file "$BIN" 2>/dev/null || true

      - name: Rename artifacts
        run: |
          VER="${{ needs.decide.outputs.app_version }}"
          cd release
          for f in *.dmg *.zip; do
            [ -f "$f" ] || continue
            NEW=$(echo "$f" | sed -E "s/[_-][0-9]+\.[0-9]+\.[0-9]+//g")
            EXT="${NEW##*.}"
            BASE="${NEW%.*}"
            FINAL="${BASE}-v${VER}.${EXT}"
            mv "$f" "$FINAL" 2>/dev/null || true
            echo "  $f → $FINAL"
          done

      - name: List artifacts
        run: |
          echo "macOS artifacts:"
          find release -maxdepth 3 \( -name "*.dmg" -o -name "*.zip" \) | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraChat-macOS-${{ needs.decide.outputs.app_version }}
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: [decide, build-windows, build-linux, build-macos]
    if: |
      always() &&
      needs.decide.outputs.publish == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.decide.outputs.build_ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist-artifacts/

      - name: List downloaded artifacts
        run: find dist-artifacts/ -type f | sort

      - name: Generate release notes
        id: notes
        run: |
          APP_VER="${{ needs.decide.outputs.app_version }}"
          TAG="${{ needs.decide.outputs.tag_name }}"
          IS_PRE="${{ needs.decide.outputs.is_prerelease }}"

          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p' || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges | head -50)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          ELECTRON_VER=$(node -p "(require('./package.json').devDependencies?.electron||'').replace('^','')")

          if [[ "$IS_PRE" == "true" ]]; then
            RELEASE_LABEL="Pre-release"
            RELEASE_NOTE="> ⚠️ This is a **pre-release** build. It may contain bugs or unfinished features."
          else
            RELEASE_LABEL="Release"
            RELEASE_NOTE="> ✅ This is a **stable release**."
          fi

          {
            echo "## AuroraChat v${APP_VER} — ${RELEASE_LABEL}"
            echo ""
            echo "${RELEASE_NOTE}"
            echo ""
            echo "### What's changed"
            if [ -n "$CHANGES" ]; then
              echo "$CHANGES"
            else
              echo "- Initial release"
            fi
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | File | Notes |"
            echo "|----------|------|-------|"
            echo "| 🪟 Windows | \`AuroraChat-Setup-v${APP_VER}.exe\` | NSIS installer — recommended |"
            echo "| 🪟 Windows | \`AuroraChat-Portable-v${APP_VER}.exe\` | No installation required |"
            echo "| 🐧 Linux | \`AuroraChat-v${APP_VER}.AppImage\` | Universal, no install needed |"
            echo "| 🐧 Linux | \`AuroraChat-v${APP_VER}.deb\` | Debian / Ubuntu |"
            echo "| 🐧 Linux | \`AuroraChat-v${APP_VER}.pacman\` | Arch / CachyOS / Manjaro |"
            echo "| 🍎 macOS | \`AuroraChat-v${APP_VER}.dmg\` | Intel + Apple Silicon |"
            echo ""
            echo "---"
            echo ""
            echo "<sub>Built with Electron \`${ELECTRON_VER}\` · Node.js \`${{ env.NODE_VERSION }}\` · better-sqlite3 prebuilt binary injected per platform</sub>"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name      : ${{ needs.decide.outputs.tag_name }}
          name          : "AuroraChat v${{ needs.decide.outputs.app_version }}"
          body_path     : RELEASE_NOTES.md
          draft         : false
          prerelease    : ${{ needs.decide.outputs.is_prerelease == 'true' }}
          make_latest   : ${{ needs.decide.outputs.is_prerelease != 'true' }}
          files         : dist-artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    needs: [decide, build-windows, build-linux, build-macos, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write summary
        run: |
          APP_VER="${{ needs.decide.outputs.app_version }}"
          CI_VER="${{ needs.decide.outputs.version }}"
          WIN="${{ needs.build-windows.result }}"
          LIN="${{ needs.build-linux.result }}"
          MAC="${{ needs.build-macos.result }}"
          PUB="${{ needs.publish.result }}"

          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }

          {
            echo "## AuroraChat v${APP_VER} — Build \`${CI_VER}\`"
            echo ""
            echo "### Platform results"
            echo ""
            echo "| Platform | Result |"
            echo "|----------|--------|"
            echo "| 🪟 Windows | $(icon $WIN) \`$WIN\` |"
            echo "| 🐧 Linux   | $(icon $LIN) \`$LIN\` |"
            echo "| 🍎 macOS   | $(icon $MAC) \`$MAC\` |"
            echo "| 🚀 Publish | $(icon $PUB) \`$PUB\` |"
            echo ""
            echo "### Build info"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| App version | \`v${APP_VER}\` |"
            echo "| Trigger     | \`${{ github.event_name }}\` |"
            echo "| Build ref   | \`${{ needs.decide.outputs.build_ref }}\` |"
            echo "| Tag         | \`${{ needs.decide.outputs.tag_name }}\` |"
            echo "| Pre-release | \`${{ needs.decide.outputs.is_prerelease }}\` |"
            echo "| Obfuscate   | \`${{ needs.decide.outputs.secure }}\` |"
          } >> $GITHUB_STEP_SUMMARY
